[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (upgrades syntax)
]
ignore = [
    "B904",   # Allow raising exception without from in some contexts
    "UP042",  # StrEnum requires Python 3.11+; we support 3.10
]

[tool.black]
line-length = 120
target-version = ['py312']
